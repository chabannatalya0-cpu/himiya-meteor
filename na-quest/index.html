<style>

*{box-sizing:border-box}

.cert{background:linear-gradient(160deg,#1c2a58,#121b36);border:2px solid var(--gold);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;text-align:center}

];
const SALTS=[['NaCl',1],['MgSO<sub>4</sub>',1],['Ca(HCO<sub>3</sub>)<sub>2</sub>',1],['KCl',1],['AgNO<sub>3</sub>',0],['CuSO<sub>4</sub>',0],['Na<sub>2</sub>S',0]];
const ELECT=[['До позитивного електрода (+)',0],['До негативного електрода (−)',1],['Залишаються на місці, бо їх притягує вода',0]];

/* ---------- state ---------- */
let S=null;
function fresh(){
  const el=shuffle(SORT_POOL.filter(x=>x[2])),ne=shuffle(SORT_POOL.filter(x=>!x[2]));
  const lp=shuffle(LAMP_POOL.filter(x=>x[2])),ln=shuffle(LAMP_POOL.filter(x=>!x[2]));
  let mech=shuffle([0,1,2,3]);while(mech.join()==='0,1,2,3')mech=shuffle([0,1,2,3]);
  return {name:'',started:false,stars:[0,0,0,0,0],tries:[0,0,0,0,0],t0:0,t1:0,
    sort:shuffle(el.slice(0,4).concat(ne.slice(0,4))).map(x=>SORT_POOL.indexOf(x)),
    mech,
    lamp:shuffle(lp.slice(0,2).concat(ln.slice(0,2))).map(x=>LAMP_POOL.indexOf(x)),
    eq:[rnd(EQ_A.length),rnd(EQ_B.length)],
    salts:shuffle([0,1,2,3].concat(shuffle([4,5,6]).slice(0,2))),
    elect:shuffle([0,1,2])};
}
try{S=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){S=null;}
if(!S||!S.sort)S=fresh();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const doneCount=()=>S.stars.filter(s=>s>0).length;
const activeIdx=()=>{const i=S.stars.findIndex(s=>!s);return i<0?5:i;};

/* ---------- map ---------- */
const stage=$('#stage');
const btns=ST.map((s,i)=>{
  const b=document.createElement('button');b.type='button';b.className='st';
  b.style.left=pct(s.x,1672);b.style.top=pct(s.y,941);
  b.addEventListener('click',()=>{if(i<=activeIdx()&&S.started)openStation(i);else if(!S.started)openStart();});
  stage.appendChild(b);return b;
});
function pathFor(pts){
  if(!pts.length)return'';
  let d=`M${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];const mx=(a.x+b.x)/2;d+=` C${mx} ${a.y-60} ${mx} ${b.y+60} ${b.x} ${b.y}`;}
  return d;
}
$('#route').setAttribute('d',pathFor(ST));
function renderMap(){
  const act=activeIdx();
  btns.forEach((b,i)=>{
    const st=S.stars[i];
    b.className='st '+(st?'done':(i===act&&S.started?'active':'locked'));
    b.innerHTML=(st?'✓':(i+1))+`<span class="tag">${ST[i].tag}</span>`+(st?`<span class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</span>`:'');
    b.setAttribute('aria-label',`Станція ${i+1}: ${ST[i].tag}${st?', пройдено':(i===act?', відкрита':', закрита')}`);
  });
  const reached=ST.slice(0,Math.min(act,4)+1);
  $('#routeDone').setAttribute('d',act>0?pathFor(reached):'');
  const tk=ST[Math.min(act,4)];
  $('#token').style.left=pct(tk.x,1672);$('#token').style.top=pct(tk.y,941);
  const stars=S.stars.reduce((a,b)=>a+b,0);
  $('#doneN').textContent=doneCount();$('#starN').textContent=stars;
  $('#pfill').style.width=(doneCount()/5*100)+'%';
  $('#who').innerHTML=S.name?`Учень: <b style="color:var(--ink)">${esc(S.name)}${S.cls?' · '+esc(S.cls):''}</b>`:'';
}

/* ---------- dialog ---------- */
const scrim=$('#scrim'),body=$('#dlgBody');
function openDlg(kicker,title,closable){
  $('#dlgKicker').textContent=kicker;$('#dlgTitle').textContent=title;
  $('#dlgX').hidden=!closable;scrim.hidden=false;body.innerHTML='';scrim.scrollTop=0;
}
function closeDlg(){scrim.hidden=true;}
$('#dlgX').addEventListener('click',closeDlg);
scrim.addEventListener('click',e=>{if(e.target===scrim&&!$('#dlgX').hidden)closeDlg();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!scrim.hidden&&!$('#dlgX').hidden)closeDlg();});
function h(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;}

function openStart(){
  openDlg('Квест · 5 станцій','Готовий вирушати?',false);
  body.append(
    h(`<p class="task">Твоє завдання — провести йон <b>Na<sup>+</sup></b> від кристала солі до скрині зі скарбом. На шляху 5 станцій. За кожну станцію — до 3 зірок.</p>`),
    h(`<label class="q" for="nm">Прізвище та ім'я</label>`),
    h(`<input type="text" id="nm" maxlength="60" autocomplete="off" placeholder="Напр.: Коваленко Марія">`),
    h(`<label class="q" for="cl">Клас</label>`),
    h(`<select id="cl" style="width:100%;font:inherit;color:var(--ink);background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:12px"><option value="">— обери —</option><option>9-А</option><option>9-Б</option><option>Інший</option></select>`),
    h(`<div class="fb bad" id="nmErr" hidden>Впиши прізвище, ім'я та обери клас, щоб вчитель побачив твій результат.</div>`),
    h(`<div class="actions"><button class="btn" id="go" type="button">Почати квест</button></div>`)
  );
  const inp=$('#nm');inp.value=S.name||'';$('#cl').value=S.cls||'';setTimeout(()=>inp.focus(),50);

    S.name=v;S.cls=c;S.started=true;S.t0=S.t0||Date.now();save();closeDlg();renderMap();};
  $('#go').onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
}

function starLine(i){const left=Math.max(1,3-S.tries[i]);return `<div class="lives">Можливі зірки: <b>${'★'.repeat(left)}${'☆'.repeat(3-left)}</b></div>`;}
function fail(i,msg,reveal){
  S.tries[i]++;save();
  const fb=body.querySelector('.fb-slot');
  fb.innerHTML=`<div class="fb bad"><b>Ще не так.</b> ${msg}</div>`;
  body.querySelector('.lives').outerHTML=starLine(i);
  if(S.tries[i]>=3&&reveal){
    const b=h(`<button class="btn sec" type="button" style="margin-top:8px">Показати правильну відповідь</button>`);
    b.onclick=()=>{reveal();fb.innerHTML=`<div class="fb ok">Подивись на правильну відповідь і запам'ятай її.</div>`;
      const n=h(`<div class="actions"><button class="btn" type="button">Далі (1 зірка)</button></div>`);n.firstChild.onclick=()=>complete(i,true);fb.appendChild(n);};
    fb.firstChild.appendChild(document.createElement('br'));fb.firstChild.appendChild(b);
  }
}
function complete(i,revealed){
  const st=revealed?1:Math.max(1,3-S.tries[i]);
  S.stars[i]=st;if(doneCount()===5)S.t1=Date.now();save();
  openDlg(`Станція ${i+1} пройдена`,ST[i].title,false);
  body.append(h(`<div class="win"><div class="big">${'★'.repeat(st)}<span style="opacity:.3">${'☆'.repeat(3-st)}</span></div>
    <p class="task">${i<4?'Йон Na<sup>+</sup> рушає далі маршрутом.':'Скриню відчинено!'}</p>
    <div class="actions"><button class="btn" type="button" id="cont">${i<4?'До карти':'Мій результат'}</button></div></div>`));
  $('#cont').onclick=()=>{closeDlg();renderMap();if(i===4)openFinal();};
}

/* ---------- station builders ---------- */
function openStation(i){
  if(S.stars[i]){openDlg(`Станція ${i+1} · пройдено`,ST[i].title,true);
    body.append(h(`<div class="win"><div class="big">${'★'.repeat(S.stars[i])}<span style="opacity:.3">${'☆'.repeat(3-S.stars[i])}</span></div><p class="task">Цю станцію вже пройдено.</p></div>`));return;}
  openDlg(`Станція ${i+1} з 5 · ${ST[i].tag}`,ST[i].title,true);
  [st1,st2,st3,st4,st5][i](i);
}
function shell(i,task){
  body.append(h(`<p class="task">${task}</p>`),h(starLine(i)));
  const area=document.createElement('div');area.style.display='flex';area.style.flexDirection='column';area.style.gap='10px';body.append(area);
  const act=h(`<div class="actions"><button class="btn" type="button">Перевірити</button></div>`);body.append(act);
  const fb=document.createElement('div');fb.className='fb-slot';body.append(fb);
  return {area,check:act.firstChild,clearFb:()=>{fb.innerHTML='';}};
}

// 1. sort
function st1(i){
  const {area,check,clearFb}=shell(i,'Визнач для кожної речовини: проводить вона електричний струм чи ні?');
  const ans={};const rows=document.createElement('div');rows.className='rows';area.append(rows);
  const items=S.sort.map(k=>SORT_POOL[k]);
  function draw(mark){
    rows.innerHTML='';
    items.forEach((it,k)=>{
      const r=h(`<div class="row${mark&&ans[k]!==undefined&&ans[k]!==it[2]?' wrong':''}"><span class="nm">${it[0]}<small>${it[1]}</small></span>
        <span class="seg"><button type="button" aria-pressed="${ans[k]===1}">проводить</button><button type="button" class="no" aria-pressed="${ans[k]===0}">не проводить</button></span></div>`);
      const [y,n]=r.querySelectorAll('button');
      y.onclick=()=>{ans[k]=1;clearFb();draw(mark);};n.onclick=()=>{ans[k]=0;clearFb();draw(mark);};
      rows.append(r);
    });
  }
  draw(false);
  check.onclick=()=>{
    if(Object.keys(ans).length<items.length){body.querySelector('.fb-slot').innerHTML='<div class="fb bad">Познач усі речовини.</div>';return;}
    const wrong=items.filter((it,k)=>ans[k]!==it[2]).length;
    if(!wrong)return complete(i);
    const mark=S.tries[i]>=1;
    fail(i,`Помилок: ${wrong}. ${mark?'Рядки з помилками підсвічено.':'Підказка: струм проводять речовини, у яких є вільні йони.'}`,
      ()=>{items.forEach((it,k)=>ans[k]=it[2]);draw(false);});
    draw(mark);
  };
}
// 2. mechanism order
function st2(i){
  const {area,check,clearFb}=shell(i,'Розстав етапи розчинення кристала NaCl у воді в правильному порядку. Користуйся стрілками ↑ ↓.');
  let order=S.mech.slice();const box=document.createElement('div');box.className='rows';area.append(box);
  function draw(){
    box.innerHTML='';
    order.forEach((m,k)=>{
      const r=h(`<div class="ord"><span class="n">${k+1}</span><span class="t">${MECH[m]}</span><span class="mv"><button type="button" class="mini" aria-label="Вгору" ${k===0?'disabled':''}>↑</button><button type="button" class="mini" aria-label="Вниз" ${k===order.length-1?'disabled':''}>↓</button></span></div>`);
      const [u,d]=r.querySelectorAll('button');
      u.onclick=()=>{[order[k-1],order[k]]=[order[k],order[k-1]];clearFb();draw();};
      d.onclick=()=>{[order[k+1],order[k]]=[order[k],order[k+1]];clearFb();draw();};
      box.append(r);
    });
  }
  draw();
  check.onclick=()=>{
    if(order.join()==='0,1,2,3')return complete(i);
    const right=order.filter((m,k)=>m===k).length;
    fail(i,`На своєму місці етапів: ${right} з 4. Спершу вода «атакує» кристал, а вільний рух йонів — це вже результат.`,()=>{order=[0,1,2,3];draw();});
  };
}
// 3. lamp
function st3(i){
  const {area,check,clearFb}=shell(i,'У склянку з електродами по черзі наливають ці речовини й замикають коло. Чи засвітиться лампочка?');
  const ans={};const rows=document.createElement('div');rows.className='rows';area.append(rows);
  const items=S.lamp.map(k=>LAMP_POOL[k]);
  function draw(){
    rows.innerHTML='';
    items.forEach((it,k)=>{
      const r=h(`<div class="row"><span class="nm">${it[0]}<small>${it[1]}</small></span>
        <span class="seg"><button type="button" aria-pressed="${ans[k]===1}">світиться</button><button type="button" class="no" aria-pressed="${ans[k]===0}">не світиться</button></span></div>`);
      const [y,n]=r.querySelectorAll('button');
      y.onclick=()=>{ans[k]=1;clearFb();draw();};n.onclick=()=>{ans[k]=0;clearFb();draw();};
      rows.append(r);
    });
  }
  draw();
  check.onclick=()=>{
    if(Object.keys(ans).length<items.length){body.querySelector('.fb-slot').innerHTML='<div class="fb bad">Зроби прогноз для всіх речовин.</div>';return;}
    const wrong=items.filter((it,k)=>ans[k]!==it[2]).length;
    if(!wrong)return complete(i);
    fail(i,`Помилок: ${wrong}. Згадай: чи є в цій речовині вільні йони, що можуть рухатися?`,()=>{items.forEach((it,k)=>ans[k]=it[2]);draw();});
  };
}
// 4. equations
function st4(i){
  const {area,check,clearFb}=shell(i,'Склади рівняння дисоціації двох речовин. Натискай на йони, щоб додати їх; повторне натискання збільшує коефіцієнт.');
  const tasks=[EQ_A[S.eq[0]],EQ_B[S.eq[1]]];
  const st=tasks.map(()=>[]);
  const boxes=tasks.map(()=>{const d=document.createElement('div');d.className='eqbox';area.append(d);return d;});
  function draw(k){
    const t=tasks[k],terms=st[k],d=boxes[k];
    d.innerHTML=`<div class="equation"><span class="formula">${t.f}</span><span class="arrow">→</span><div class="terms"></div></div><div class="bal"></div><div class="bank"></div>`;
    const tb=d.querySelector('.terms');
    if(!terms.length)tb.innerHTML='<span class="placeholder">обери йони нижче</span>';
    terms.forEach((tm,j)=>{
      if(j)tb.append(h('<span class="plus-sep">+</span>'));
      const [lab,c]=ION[tm.id];
      const w=h(`<span class="term"><button type="button" class="mini" aria-label="Менше">−</button><span class="coef">${tm.c}</span><button type="button" class="mini" aria-label="Більше">+</button><span class="ion ${c>0?'c':'a'}">${lab}</span><button type="button" class="mini" aria-label="Прибрати">×</button></span>`);
      const [dn,up,rm]=w.querySelectorAll('button');
      dn.onclick=()=>{tm.c--;if(tm.c<1)terms.splice(j,1);clearFb();draw(k);};
      up.onclick=()=>{tm.c=Math.min(9,tm.c+1);clearFb();draw(k);};
      rm.onclick=()=>{terms.splice(j,1);clearFb();draw(k);};
      tb.append(w);
    });
    if(terms.length){let sum=0;const p=terms.map(tm=>{const c=ION[tm.id][1];sum+=tm.c*c;return `${tm.c>1?tm.c+'·':''}(${c>0?'+':'−'}${Math.abs(c)})`;});
      d.querySelector('.bal').innerHTML=`Сума зарядів: ${p.join(' + ')} = <span class="${sum===0?'z':'nz'}">${sum>0?'+':sum<0?'−':''}${Math.abs(sum)}${sum===0?' ✓':''}</span>`;}
    const bank=d.querySelector('.bank');
    t.b.forEach(id=>{const [lab,c]=ION[id];const b=h(`<button type="button" class="tile ${c>0?'c':'a'}">${lab}</button>`);
      b.onclick=()=>{const ex=terms.find(x=>x.id===id);if(ex)ex.c=Math.min(9,ex.c+1);else terms.push({id,c:1});clearFb();draw(k);};bank.append(b);});
  }
  tasks.forEach((_,k)=>draw(k));
  function diag(t,terms){
    if(!terms.length)return 'Рівняння порожнє.';
    for(const tm of terms){if(!(tm.id in t.a)){const tr=ION[tm.id][2];return tr?TRAP[tr]:'Такого йона немає в цій речовині.';}}
    if(terms.length<Object.keys(t.a).length)return 'Не вистачає йона: потрібні і катіон, і аніон.';
    const sum=terms.reduce((s,tm)=>s+tm.c*ION[tm.id][1],0);
    if(sum)return 'Сума зарядів не дорівнює нулю. Індекси у формулі стають коефіцієнтами.';
    for(const tm of terms)if(t.a[tm.id]!==tm.c)return 'Коефіцієнти мають відповідати індексам у формулі й бути найменшими.';
    return null;
  }
  check.onclick=()=>{
    const errs=tasks.map((t,k)=>diag(t,st[k]));
    if(errs.every(e=>!e))return complete(i);
    const k=errs.findIndex(e=>e);
    fail(i,`Рівняння для ${tasks[k].f}: ${errs[k]}`,()=>{tasks.forEach((t,k)=>{st[k]=Object.entries(t.a).map(([id,c])=>({id,c}));draw(k);});});
  };
}
// 5. chest
function st5(i){
  const {area,check,clearFb}=shell(i,'Щоб відчинити скриню, розгадай етикетку мінеральної води.');
  area.append(h(`<div class="label-card"><div class="ttl">Мінеральна вода «Сузір'я»</div>
    <div class="small">Мінералізація 2,1–2,9 г/дм³. Склад, мг/дм³:</div>
    <div class="ions"><span>Na<sup>+</sup> + K<sup>+</sup></span><span>Ca<sup>2+</sup></span><span>Mg<sup>2+</sup></span><span>HCO<sub>3</sub><sup>−</sup></span><span>SO<sub>4</sub><sup>2−</sup></span><span>Cl<sup>−</sup></span></div></div>`));
  area.append(h(`<div class="q">1) Дисоціація яких солей могла дати ці йони? Обери всі правильні.</div>`));
  const sel=new Set();const ck=document.createElement('div');ck.className='checks';area.append(ck);
  area.append(h(`<div class="q">2) Куди рухатимуться йони Na<sup>+</sup>, якщо опустити у воду електроди й замкнути коло?</div>`));
  let pick=null;const rd=document.createElement('div');rd.className='radios';area.append(rd);
  function draw(){
    ck.innerHTML='';
    S.salts.forEach(j=>{const b=h(`<button type="button" class="chk" aria-pressed="${sel.has(j)}"><span class="box">${sel.has(j)?'✓':''}</span>${SALTS[j][0]}</button>`);
      b.onclick=()=>{sel.has(j)?sel.delete(j):sel.add(j);clearFb();draw();};ck.append(b);});
    rd.innerHTML='';
    S.elect.forEach(j=>{const b=h(`<button type="button" class="chk" style="font:600 15px var(--body)" aria-pressed="${pick===j}"><span class="box" style="border-radius:50%">${pick===j?'•':''}</span>${ELECT[j][0]}</button>`);
      b.onclick=()=>{pick=j;clearFb();draw();};rd.append(b);});
  }
  draw();
  check.onclick=()=>{
    if(!sel.size||pick===null){body.querySelector('.fb-slot').innerHTML='<div class="fb bad">Дай відповідь на обидва питання.</div>';return;}
    const okSalts=S.salts.every(j=>sel.has(j)===!!SALTS[j][1]);
    const okE=ELECT[pick][1]===1;
    if(okSalts&&okE)return complete(i);
    const m=[];
    if(!okSalts)m.push('Питання 1: обирай лише солі, обидва йони яких є на етикетці. Перевір, чи немає зайвих і чи не пропущено правильних.');
    if(!okE)m.push('Питання 2: різнойменні заряди притягуються.');
    fail(i,m.join(' '),()=>{sel.clear();S.salts.forEach(j=>{if(SALTS[j][1])sel.add(j);});pick=1;draw();});
  };
}

/* ---------- final ---------- */
function openFinal(){
  openDlg('Квест завершено','Скарб знайдено!',true);
  const total=S.stars.reduce((a,b)=>a+b,0);
  const min=S.t1&&S.t0?Math.max(1,Math.round((S.t1-S.t0)/60000)):null;
  const rows=ST.map((s,k)=>`<tr><td>${k+1}. ${s.title}</td><td>${'★'.repeat(S.stars[k])}${'☆'.repeat(3-S.stars[k])}</td></tr>`).join('');
  body.append(h(`<div class="cert"><span class="eyebrow">Мандрівка йона Na⁺ · Електролітична дисоціація</span>
    <div class="who">${esc(S.name)}</div>
    <div style="font:800 34px var(--display);color:var(--gold)" class="tabnum">${total} / 15 ★</div>
    <table>${rows}</table>
    <div class="eyebrow">${min?`Час проходження: ${min} хв · `:''}${new Date(S.t1||Date.now()).toLocaleDateString('uk-UA')}</div></div>`));
  const grade=Math.round(total/15*12);
  body.append(h(`<p class="task" style="text-align:center">Оцінка: <b style="color:var(--gold)">${grade} / 12</b></p>`));
  const msg=h(`<div class="fb" style="text-align:center">Надсилаю результат учителю…</div>`);body.append(msg);
  sendResult(total,grade,min,msg);
}
const FIREBASE_URL="https://batareya-znan-daa00-default-rtdb.europe-west1.firebasedatabase.app";
const WORK_ID="kvestna9";
async function sendResult(total,grade,min,msg){
  if(S.sentAt&&S.sentAt===S.t1){msg.className='fb ok';msg.textContent='✓ Результат уже отримано вчителем.';return;}
  const rec={name:S.name.slice(0,60),cls:S.cls||'',score:grade,max:12,stars:total,parts:S.stars.join(' '),minutes:min||0,ts:{".sv":"timestamp"}};
  try{const r=await fetch(`${FIREBASE_URL}/results/${WORK_ID}.json`,{method:'POST',body:JSON.stringify(rec)});
    if(!r.ok)throw new Error(r.status);S.sentAt=S.t1;save();
    msg.className='fb ok';msg.textContent='✓ Результат отримано вчителем. Молодець!';
  }catch(e){msg.className='fb bad';msg.innerHTML='Не вдалося надіслати. Перевір інтернет і натисни кнопку.';
    const b=h(`<div class="actions" style="justify-content:center;margin-top:8px"><button class="btn" type="button">Надіслати ще раз</button></div>`);
    b.firstChild.onclick=()=>{b.remove();msg.className='fb';msg.textContent='Надсилаю…';sendResult(total,grade,min,msg);};msg.after(b);}
}

/* ---------- reset ---------- */
let armed=false;
$('#resetBtn').addEventListener('click',e=>{
  const b=e.currentTarget;
  if(!armed){armed=true;b.textContent='Точно стерти прогрес? Натисни ще раз';b.classList.add('warn');setTimeout(()=>{armed=false;b.textContent='Почати заново';b.classList.remove('warn');},4000);return;}
  const nm=S.name,cl=S.cls;S=fresh();S.name=nm;S.cls=cl;save();armed=false;b.textContent='Почати заново';b.classList.remove('warn');renderMap();openStart();
});

renderMap();
if(!S.started)openStart();
else if(doneCount()===5)openFinal();
})();
</script>

</body></html>
